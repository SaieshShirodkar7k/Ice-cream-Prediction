<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ice Cream Sales Predictor</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <div class="card">
      <h1>🍦 Ice Cream Sales Predictor</h1>
      <form id="predictForm">
        <label for="temperature">Temperature (°F):</label>
        <input
          type="number"
          step="0.1"
          id="temperature"
          placeholder="Enter temperature"
          required
        />

        <label for="rainfall">Rainfall (inches):</label>
        <input
          type="number"
          step="0.01"
          id="rainfall"
          placeholder="Enter rainfall"
          required
        />

        <button type="submit">Predict Sales</button>
      </form>
      <h2 id="result"></h2>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>
